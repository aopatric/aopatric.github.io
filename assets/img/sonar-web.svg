<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="globeFill" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#123152"/>
      <stop offset="55%" stop-color="#081a2e"/>
      <stop offset="100%" stop-color="#030a15"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33e0ff"/>
      <stop offset="100%" stop-color="#4affa0"/>
    </linearGradient>
    <radialGradient id="landFill" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e5a72"/>
      <stop offset="100%" stop-color="#123f52"/>
    </radialGradient>
    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#33e0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#33e0ff" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer atmosphere glow -->
  <circle cx="100" cy="100" r="86" fill="url(#atmoGlow)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#33e0ff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- globe body -->
  <circle cx="100" cy="100" r="72" fill="url(#globeFill)" stroke="url(#ringStroke)" stroke-width="1.4"/>

  <clipPath id="globeClip">
    <circle cx="100" cy="100" r="72"/>
  </clipPath>

  <g clip-path="url(#globeClip)">

    <!-- stylized landmasses -->
    <g fill="url(#landFill)" opacity="0.9">
      <path d="M 55 55 Q 70 45 85 52 Q 95 58 88 68 Q 100 72 96 82 Q 82 90 70 82 Q 58 84 52 72 Q 46 62 55 55 Z"/>
      <path d="M 105 60 Q 125 52 142 62 Q 150 72 140 80 Q 148 90 135 96 Q 118 98 112 86 Q 102 78 105 60 Z"/>
      <path d="M 60 110 Q 78 104 90 114 Q 96 126 84 134 Q 88 146 72 148 Q 58 142 56 128 Q 50 118 60 110 Z"/>
      <path d="M 110 118 Q 128 112 140 122 Q 146 134 132 140 Q 128 150 112 146 Q 104 136 106 126 Q 104 122 110 118 Z"/>
    </g>

    <!-- latitude lines -->
    <g stroke="#33e0ff" stroke-opacity="0.25" stroke-width="0.7" fill="none">
      <ellipse cx="100" cy="100" rx="72" ry="20"/>
      <ellipse cx="100" cy="72" rx="60" ry="10"/>
      <ellipse cx="100" cy="128" rx="60" ry="10"/>
    </g>

    <!-- longitude lines -->
    <g stroke="#33e0ff" stroke-opacity="0.25" stroke-width="0.7" fill="none">
      <ellipse cx="100" cy="100" rx="20" ry="72"/>
      <ellipse cx="100" cy="100" rx="46" ry="72"/>
      <path d="M 100 28 A 72 72 0 0 1 100 172"/>
      <path d="M 100 28 A 72 72 0 0 0 100 172"/>
    </g>

    <!-- signal arcs between nodes -->
    <g fill="none" stroke="#4affa0" stroke-width="1" stroke-opacity="0.75">
      <path d="M 62 58 Q 100 36 140 66"/>
      <path d="M 140 66 Q 148 108 118 136"/>
      <path d="M 118 136 Q 80 152 58 122"/>
      <path d="M 58 122 Q 44 88 62 58"/>
      <path d="M 62 58 Q 92 96 118 136" stroke-dasharray="2 5" stroke-opacity="0.4"/>
      <path d="M 140 66 Q 100 100 58 122" stroke-dasharray="2 5" stroke-opacity="0.4"/>
    </g>

    <!-- traveling pulse dots along arcs -->
    <g fill="#a8fff0">
      <circle r="1.6">
        <animateMotion dur="3s" repeatCount="indefinite" path="M 62 58 Q 100 36 140 66"/>
      </circle>
      <circle r="1.6">
        <animateMotion dur="2.7s" repeatCount="indefinite" path="M 140 66 Q 148 108 118 136"/>
      </circle>
      <circle r="1.6">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 118 136 Q 80 152 58 122"/>
      </circle>
      <circle r="1.6">
        <animateMotion dur="2.9s" repeatCount="indefinite" path="M 58 122 Q 44 88 62 58"/>
      </circle>
    </g>
  </g>

  <!-- network nodes (federated peers) -->
  <g filter="url(#glow)">
    <circle cx="62" cy="58" r="5" fill="#4affa0"/>
    <circle cx="140" cy="66" r="4.5" fill="#33e0ff"/>
    <circle cx="118" cy="136" r="5" fill="#4affa0"/>
    <circle cx="58" cy="122" r="4.5" fill="#33e0ff"/>
    <circle cx="100" cy="100" r="4.5" fill="#ffffff"/>
  </g>

  <!-- node pulse rings -->
  <g fill="none" stroke="#4affa0" stroke-width="1">
    <circle cx="62" cy="58" r="5">
      <animate attributeName="r" values="5;13;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="66" r="4.5">
      <animate attributeName="r" values="4.5;12;4.5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="118" cy="136" r="5">
      <animate attributeName="r" values="5;13;5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="122" r="4.5">
      <animate attributeName="r" values="4.5;12;4.5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer ring accent -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#ringStroke)" stroke-width="0.8" stroke-opacity="0.6"/>
</svg>
