<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Does the edge of stability survive post-training? Sharpness during Alpaca fine-tuning of Pythia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ahInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#14213D"/>
    </marker>
  </defs>

  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans  { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="#EDF1F7"/>

  <!-- Title -->
  <g class="serif" fill="#14213D" font-weight="700" font-size="54">
    <text x="56" y="112">Does the edge of</text>
    <text x="56" y="172">stability survive</text>
    <text x="56" y="232">post-training?</text>
  </g>
  <text class="sans" x="56" y="282" font-size="18" fill="#4A5876">Sharpness during Alpaca fine-tuning of Pythia</text>

  <!-- Hero chart: sharpness vs 2/eta -->
  <g>
    <rect x="580" y="60" width="564" height="48" fill="#E5484D" fill-opacity="0.09"/>
    <line x1="580" y1="290" x2="1144" y2="290" stroke="#14213D" stroke-width="1.5"/>
    <line x1="580" y1="60" x2="580" y2="290" stroke="#14213D" stroke-width="1.5"/>

    <line x1="870" y1="112" x2="870" y2="290" stroke="#14213D" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>

    <line x1="580" y1="108" x2="1144" y2="108" stroke="#E5484D" stroke-width="3" stroke-dasharray="9 7"/>

    <path d="M580 266 C 650 260, 720 215, 790 160 C 820 135, 840 118, 870 112 C 890 108, 900 120, 920 114 S 960 104, 985 115 S 1030 106, 1055 114 S 1100 108, 1144 113" fill="none" stroke="#2D5BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="870" cy="112" r="7" fill="#EDF1F7" stroke="#14213D" stroke-width="3"/>

    <text class="serif" x="590" y="98" font-size="20" font-style="italic" fill="#E5484D">2/η</text>
    <text class="sans" x="1136" y="84" font-size="14" font-weight="600" fill="#E5484D" text-anchor="end">unstable</text>
    <text class="sans" x="742" y="258" font-size="15" font-weight="600" fill="#2D5BFF">sharpness</text>
    <text class="serif" x="1010" y="160" font-size="17" font-style="italic" fill="#2D5BFF">hovers at the edge</text>
    <g class="sans" font-size="13" fill="#4A5876">
      <text x="870" y="310" text-anchor="middle">reaches 2/η</text>
      <text x="1144" y="310" text-anchor="end">training steps</text>
    </g>
  </g>

  <!-- Panel -->
  <rect x="56" y="346" width="1088" height="228" rx="18" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/>
  <g stroke="#D5DCE8" stroke-width="1.5">
    <line x1="328" y1="374" x2="328" y2="546"/>
    <line x1="600" y1="374" x2="600" y2="546"/>
    <line x1="872" y1="374" x2="872" y2="546"/>
  </g>

  <!-- Pythia: layer stack -->
  <g transform="translate(192 420)" stroke="#14213D" stroke-width="2">
    <rect x="-42" y="-42" width="70" height="16" rx="4" fill="#BFD0FF"/>
    <rect x="-42" y="-20" width="70" height="16" rx="4" fill="#BFD0FF"/>
    <rect x="-42" y="2" width="70" height="16" rx="4" fill="#BFD0FF"/>
    <rect x="-42" y="24" width="70" height="16" rx="4" fill="#BFD0FF"/>
    <line x1="48" y1="40" x2="48" y2="-40" marker-end="url(#ahInk)" stroke-linecap="round"/>
  </g>

  <!-- Alpaca: instruction and response -->
  <g transform="translate(464 420)" stroke="#14213D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-62 -38 H6 a8 8 0 0 1 8 8 V-14 a8 8 0 0 1 -8 8 H-44 L-54 4 L-52 -6 H-54 a8 8 0 0 1 -8 -8 V-30 a8 8 0 0 1 8 -8 Z" fill="#BFD0FF"/>
    <path d="M-14 8 H54 a8 8 0 0 1 8 8 V32 a8 8 0 0 1 -8 8 H52 L54 50 L42 40 H-14 a8 8 0 0 1 -8 -8 V16 a8 8 0 0 1 8 -8 Z" fill="#FFFFFF"/>
    <line x1="-48" y1="-26" x2="0" y2="-26" stroke-width="2.5"/>
    <line x1="-48" y1="-16" x2="-14" y2="-16" stroke-width="2.5"/>
    <line x1="-8" y1="18" x2="48" y2="18" stroke-width="2.5"/>
    <line x1="-8" y1="30" x2="30" y2="30" stroke-width="2.5"/>
  </g>

  <!-- Sharpness: sharp vs flat basin -->
  <g transform="translate(736 420)" fill="none" stroke-linecap="round">
    <path d="M-64 -30 Q 0 52 64 -30" stroke="#A9B4C8" stroke-width="3"/>
    <path d="M-30 -46 Q 0 62 30 -46" stroke="#2D5BFF" stroke-width="4"/>
    <circle cx="0" cy="8" r="7" fill="#14213D" stroke="none"/>
  </g>

  <!-- Threshold: hovering below 2/eta -->
  <g transform="translate(1008 420)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-66" y1="-20" x2="66" y2="-20" stroke="#E5484D" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M-62 40 C -40 35, -20 5, -5 -12 C 5 -22, 15 -14, 25 -19 S 45 -14, 62 -19" stroke="#2D5BFF" stroke-width="4"/>
    <text class="serif" x="-66" y="-30" font-size="18" font-style="italic" fill="#E5484D" stroke="none">2/η</text>
  </g>

  <!-- Labels -->
  <g class="sans" text-anchor="middle">
    <g font-size="23" font-weight="700" fill="#14213D">
      <text x="192" y="508">Pythia</text>
      <text x="464" y="508">Alpaca</text>
      <text x="736" y="508">Sharpness</text>
      <text x="1008" y="508">The 2/η line</text>
    </g>
    <g font-size="14" fill="#4A5876">
      <text x="192" y="534">Pretrained base model</text>
      <text x="464" y="534">Instruction data for post-training</text>
      <text x="736" y="534">Top Hessian eigenvalue each step</text>
      <text x="1008" y="534">Does it hover there after tuning?</text>
    </g>
  </g>

  <text class="sans" x="56" y="606" font-size="13" fill="#6B7790">A revisit of an earlier project, demoed by fine-tuning Pythia on Alpaca</text>
</svg>
