<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Can mech interp catch reward hacking? Probing, patching, SAEs and steering on Qwen3-4B" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ahInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#14213D"/>
    </marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#2D5BFF"/>
    </marker>
  </defs>

  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans  { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="#EDF1F7"/>

  <!-- Title -->
  <g class="serif" fill="#14213D" font-weight="700" font-size="54">
    <text x="56" y="112">Can mech interp</text>
    <text x="56" y="172">catch reward</text>
    <text x="56" y="232">hacking?</text>
  </g>
  <text class="sans" x="56" y="282" font-size="18" fill="#4A5876">Probing, patching, SAEs and steering on Qwen3-4B</text>

  <!-- Hero chart: proxy reward vs true success -->
  <g>
    <line x1="580" y1="290" x2="1144" y2="290" stroke="#14213D" stroke-width="1.5"/>
    <line x1="580" y1="60" x2="580" y2="290" stroke="#14213D" stroke-width="1.5"/>

    <path d="M800 180 C 880 135, 1000 100, 1144 84 L1144 272 C 1090 255, 1020 220, 960 185 C 900 150, 850 150, 800 180 Z" fill="#E5484D" fill-opacity="0.13"/>

    <line x1="800" y1="180" x2="800" y2="290" stroke="#14213D" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>

    <path d="M580 262 C 640 255, 720 225, 800 180 C 880 135, 1000 100, 1144 84" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
    <path d="M580 262 C 640 255, 720 225, 800 180 C 850 150, 900 150, 960 185 S 1090 255, 1144 272" fill="none" stroke="#2D5BFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="800" cy="180" r="7" fill="#EDF1F7" stroke="#14213D" stroke-width="3"/>

    <g class="sans" font-size="15" font-weight="600">
      <text x="790" y="128" text-anchor="end" fill="#E5484D">proxy reward</text>
      <text x="880" y="256" fill="#2D5BFF">true task success</text>
    </g>
    <text class="serif" x="1060" y="165" font-size="17" font-style="italic" fill="#E5484D">hacking gap</text>
    <g class="sans" font-size="13" fill="#4A5876">
      <text x="800" y="310" text-anchor="middle">hacking starts</text>
      <text x="1144" y="310" text-anchor="end">RL training steps</text>
    </g>
  </g>

  <!-- Tool panel -->
  <rect x="56" y="346" width="1088" height="228" rx="18" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/>
  <g stroke="#D5DCE8" stroke-width="1.5">
    <line x1="328" y1="374" x2="328" y2="546"/>
    <line x1="600" y1="374" x2="600" y2="546"/>
    <line x1="872" y1="374" x2="872" y2="546"/>
  </g>

  <!-- Probing -->
  <g transform="translate(192 420)">
    <line x1="5" y1="-48" x2="-10" y2="48" stroke="#14213D" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#2D5BFF">
      <circle cx="-55" cy="-25" r="6"/><circle cx="-35" cy="-5" r="6"/><circle cx="-45" cy="20" r="6"/>
      <circle cx="-15" cy="-30" r="6"/><circle cx="-62" cy="8" r="6"/><circle cx="-22" cy="26" r="6"/>
    </g>
    <g fill="#E5484D">
      <circle cx="30" cy="-30" r="6"/><circle cx="52" cy="-8" r="6"/><circle cx="26" cy="14" r="6"/>
      <circle cx="58" cy="24" r="6"/><circle cx="40" cy="36" r="6"/><circle cx="66" cy="-32" r="6"/>
    </g>
  </g>

  <!-- Patching -->
  <g transform="translate(464 420)" stroke="#14213D" stroke-width="2">
    <rect x="-62" y="-36" width="40" height="20" rx="4" fill="#BFD0FF"/>
    <rect x="-62" y="-10" width="40" height="20" rx="4" fill="#BFD0FF"/>
    <rect x="-62" y="16" width="40" height="20" rx="4" fill="#BFD0FF"/>
    <rect x="22" y="-36" width="40" height="20" rx="4" fill="#F7C2C4"/>
    <rect x="22" y="-10" width="40" height="20" rx="4" fill="#BFD0FF"/>
    <rect x="22" y="16" width="40" height="20" rx="4" fill="#F7C2C4"/>
    <line x1="-18" y1="0" x2="17" y2="0" marker-end="url(#ahInk)" stroke-linecap="round"/>
  </g>

  <!-- SAEs -->
  <g transform="translate(736 420)">
    <g stroke="#2D5BFF" stroke-width="1.6" opacity="0.6" fill="none">
      <path d="M-62 -22 L0 -28 M-62 0 L0 -28 M-62 22 L0 -28"/>
      <path d="M-62 -22 L0 14 M-62 0 L0 14 M-62 22 L0 14"/>
      <path d="M0 -28 L62 -22 M0 -28 L62 0 M0 14 L62 0 M0 14 L62 22"/>
    </g>
    <g fill="#FFFFFF" stroke="#14213D" stroke-width="2">
      <circle cx="-62" cy="-22" r="6"/><circle cx="-62" cy="0" r="6"/><circle cx="-62" cy="22" r="6"/>
      <circle cx="62" cy="-22" r="6"/><circle cx="62" cy="0" r="6"/><circle cx="62" cy="22" r="6"/>
    </g>
    <g fill="#FFFFFF" stroke="#A9B4C8" stroke-width="2">
      <circle cx="0" cy="-42" r="5"/><circle cx="0" cy="-14" r="5"/><circle cx="0" cy="0" r="5"/>
      <circle cx="0" cy="28" r="5"/><circle cx="0" cy="42" r="5"/>
    </g>
    <g fill="#2D5BFF" stroke="#14213D" stroke-width="2">
      <circle cx="0" cy="-28" r="6.5"/><circle cx="0" cy="14" r="6.5"/>
    </g>
  </g>

  <!-- Steering -->
  <g transform="translate(1008 420)" fill="none" stroke-linecap="round">
    <line x1="-62" y1="28" x2="2" y2="28" stroke="#14213D" stroke-width="3" marker-end="url(#ahInk)"/>
    <line x1="0" y1="28" x2="46" y2="-28" stroke="#2D5BFF" stroke-width="3" marker-end="url(#ahBlue)"/>
    <line x1="-62" y1="28" x2="44" y2="-26" stroke="#14213D" stroke-width="2" stroke-dasharray="3 6" opacity="0.6"/>
    <text class="serif" x="48" y="14" font-size="18" font-style="italic" fill="#2D5BFF" stroke="none">αv</text>
  </g>

  <!-- Tool labels -->
  <g class="sans" text-anchor="middle">
    <g font-size="23" font-weight="700" fill="#14213D">
      <text x="192" y="508">Probing</text>
      <text x="464" y="508">Patching</text>
      <text x="736" y="508">SAEs</text>
      <text x="1008" y="508">Steering</text>
    </g>
    <g font-size="14" fill="#4A5876">
      <text x="192" y="534">Read the hack from activations</text>
      <text x="464" y="534">Swap activations to find the cause</text>
      <text x="736" y="534">Name the features that fire</text>
      <text x="1008" y="534">Push the model off the hack</text>
    </g>
  </g>

  <text class="sans" x="56" y="606" font-size="13" fill="#6B7790">Environment from "Steering RL Training: Benchmarking Interventions Against Reward Hacking"</text>
</svg>
