<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paperFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="100%" stop-color="#bfeaf5"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9dbe8"/>
      <stop offset="100%" stop-color="#7fc0d2"/>
    </linearGradient>
    <linearGradient id="paperDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fb0c4"/>
      <stop offset="100%" stop-color="#4a8fa6"/>
    </linearGradient>
    <linearGradient id="accentEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4affa0"/>
      <stop offset="100%" stop-color="#25c47f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" fill="#04121c"/>
  <circle cx="100" cy="105" r="88" fill="#33e0ff" opacity="0.05"/>

  <g stroke="#04202e" stroke-width="1" stroke-linejoin="round">
    <!-- petal-fold stage: paper narrowed to a kite, top and bottom points not yet pulled into neck/tail -->

    <!-- back panel -->
    <polygon points="100,52 148,118 100,158 90,118" fill="url(#paperDeep)"/>

    <!-- front-right panel, folded over -->
    <polygon points="100,52 140,120 100,158" fill="url(#paperShade)"/>

    <!-- front-left panel -->
    <polygon points="100,52 60,120 100,158" fill="url(#paperFront)"/>

    <!-- raised triangular flap mid-fold, lifting off the surface -->
    <polygon points="100,52 100,120 66,96" fill="url(#accentEdge)" opacity="0.9"/>
    <polygon points="100,52 100,120 66,96" fill="none" stroke="#0a3d2a" stroke-width="0.8"/>

    <!-- horizontal crease (petal fold base line) -->
    <line x1="60" y1="120" x2="140" y2="120" stroke="#4a8fa6" stroke-width="0.9" stroke-dasharray="4 3"/>

    <!-- centerline crease -->
    <line x1="100" y1="52" x2="100" y2="158" stroke="#04202e" stroke-width="1"/>

    <!-- diagonal crease guides suggesting the fold in progress -->
    <line x1="100" y1="52" x2="60" y2="120" stroke="#7fc0d2" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="100" y1="52" x2="140" y2="120" stroke="#7fc0d2" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="100" y1="158" x2="90" y2="118" stroke="#7fc0d2" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- a lifted paper edge to suggest mid-motion -->
    <path d="M 66 96 Q 78 88 100 94" fill="none" stroke="#a8fff0" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- fingertip fold hint: small arrow suggesting the fold direction -->
  <g stroke="#a8fff0" stroke-width="1.1" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 50 80 Q 60 90 66 96"/>
    <path d="M 60 91 L 66 96 L 59 98"/>
  </g>
</svg>
